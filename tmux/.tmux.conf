set -sg escape-time 50

#copy mode : use spase to start, enter to end
setw -g mode-keys vi

# 启用鼠标支持
set -g mouse on
# 解除右键弹出菜单的绑定
#unbind -n MouseDown3Pane
# 解除鼠标松开时自动复制，改为直接取消选择（退出复制模式且不复制）
#bind -T copy-mode MouseDragEnd1Pane send-keys -X cancel
#bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X cancel

# 增加历史缓冲区行数
set -g history-limit 20000

# remap prefix from 'C-b' to 'C-q'
unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# switch panes using Alt-hjkl without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# don't rename windows automatically
set-option -g allow-rename off

#消息提示样式
set -g message-style 'fg=black bg=red bold'

#窗格边框样式
set -g pane-border-style 'fg=white'          # 非活动 pane 边框:红色
set -g pane-active-border-style 'fg=yellow' # 活动 pane 边框:黄色

# 更改下方状态栏
set -g status-position bottom   # 状态栏放底部(默认就是 bottom)
set -g status-justify left      # 窗口列表靠左排列
set -g status-style 'fg=red'    # 状态栏默认前景色:红
set -g status-left ''           # 左侧留空(不显示 session 名等)
set -g status-left-length 10    # 左侧最大长度(留空后其实无影响)
set -g status-right-style 'fg=yellow bg=black'  # 黑字黄底
set -g status-right '%Y-%m-%d %H:%M '           # 格式:2026-10-19 14:30
set -g status-right-length 50                   # 右侧最大字符数

# 当前窗口
setw -g window-status-current-style 'fg=black bg=red'    # 黑字红底
setw -g window-status-current-format ' #I #W #F '        # 索引 名称 标志

# 非当前窗口
setw -g window-status-style 'fg=red bg=black'                  # 红字黑底
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F ' # 名称白色、标志黄色

# 窗口收到 bell 时
setw -g window-status-bell-style 'fg=black bg=red bold'  # 黑字红底加粗
